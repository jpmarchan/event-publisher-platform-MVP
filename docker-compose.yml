name: plataforma-eventos

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EVENTSERVICE_DB: ${EVENTSERVICE_DB}
      NOTIFICATIONSERVICE_DB: ${NOTIFICATIONSERVICE_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs,sns
      DEFAULT_REGION: ${AWS_REGION}
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  # KC_HOSTNAME = issuer público; las Apis usan la red interna (backchannel) para discovery/JWKS.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: "http://localhost:8180"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 30

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686"

  eventservice-api:
    build:
      context: .
      dockerfile: src/EventService/EventService.Api/Dockerfile
    environment:
      ConnectionStrings__EventServiceDb: "Host=postgres;Port=5432;Database=${EVENTSERVICE_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable"
      ConnectionStrings__Redis: "redis:6379"
      Redis__Password: ${REDIS_PASSWORD}
      Redis__UseTls: "false"
      Aws__ServiceUrl: "http://localstack:4566"
      Aws__Region: ${AWS_REGION}
      Aws__AccessKey: ${AWS_ACCESS_KEY_ID}
      Aws__SecretKey: ${AWS_SECRET_ACCESS_KEY}
      Otel__Endpoint: "http://jaeger:4317"
      Seed__DemoData: "true"
      Oidc__Authority: "http://keycloak:8080/realms/plataforma-eventos"
      Oidc__Issuer: "http://localhost:8180/realms/plataforma-eventos"
      Oidc__Audience: "eventservice-api"
      Oidc__RequireHttpsMetadata: "false"
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "5101:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  notificationservice-api:
    build:
      context: .
      dockerfile: src/NotificationService/NotificationService.Api/Dockerfile
    environment:
      ConnectionStrings__NotificationServiceDb: "Host=postgres;Port=5432;Database=${NOTIFICATIONSERVICE_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable"
      Aws__ServiceUrl: "http://localstack:4566"
      Aws__Region: ${AWS_REGION}
      Aws__AccessKey: ${AWS_ACCESS_KEY_ID}
      Aws__SecretKey: ${AWS_SECRET_ACCESS_KEY}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__From: ${SMTP_FROM}
      Otel__Endpoint: "http://jaeger:4317"
      Oidc__Authority: "http://keycloak:8080/realms/plataforma-eventos"
      Oidc__Issuer: "http://localhost:8180/realms/plataforma-eventos"
      Oidc__Audience: "notificationservice-api"
      Oidc__RequireHttpsMetadata: "false"
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "5102:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/event-registration
      args:
        VITE_EVENT_SERVICE_URL: "http://localhost:5101"
        VITE_OIDC_AUTHORITY: "http://localhost:8180/realms/plataforma-eventos"
        VITE_OIDC_CLIENT_ID: "event-registration-spa"
    ports:
      - "5173:80"
    depends_on:
      - eventservice-api

  # docker compose --profile loadtest run --rm k6
  k6:
    image: grafana/k6:1.8.1
    profiles: ["loadtest"]
    command: ["run", "/scripts/events-load.js"]
    environment:
      BASE_URL: "http://eventservice-api:8080"
      TOKEN_URL: "http://keycloak:8080/realms/plataforma-eventos/protocol/openid-connect/token"
    volumes:
      - ./tests/load:/scripts:ro
    depends_on:
      - eventservice-api

volumes:
  postgres_data:
